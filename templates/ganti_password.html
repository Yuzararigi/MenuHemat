{% extends "base.html" %}
{% block title %}Ganti password{% endblock %}
{% block content %}
<h1>Ganti password</h1>
{% if err %}<p class="err">{{ err }}</p>{% endif %}
<form method="post" action="{{ url_for('ganti_password') }}" class="panel">
  <div class="row">
    <label>Password lama
      <input type="password" name="lama" autocomplete="current-password" required>
    </label>
  </div>
  <div class="row">
    <label>Password baru (min. 4 karakter)
      <input type="password" name="baru" autocomplete="new-password" required>
    </label>
  </div>
  <div class="row">
    <label>Ulangi password baru
      <input type="password" name="baru2" autocomplete="new-password" required>
    </label>
  </div>
  <button type="submit" class="btn">Simpan password baru</button>
</form>
{% endblock %}
