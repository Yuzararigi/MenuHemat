{% extends "base.html" %}
{% block title %}Masuk{% endblock %}
{% block content %}
<h1>Masuk</h1>
{% if err %}<p class="err">{{ err }}</p>{% endif %}
<form method="post" action="{{ url_for('login', next=next) }}" class="panel">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="row">
    <label>Username
      <input type="text" name="username" autocomplete="username" required>
    </label>
  </div>
  <div class="row">
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
  </div>
  <button type="submit" class="btn">Masuk</button>
</form>
<p class="muted small">Akun demo — admin: <code>admin</code> / <code>admin123</code> &middot; pengguna: <code>user</code> / <code>user123</code>. Segera ganti password setelah masuk.</p>
{% endblock %}
