{% extends "base.html" %}
{% block title %}Kelola resep{% endblock %}
{% block content %}
<p><a href="{{ url_for('admin_index') }}">&larr; Panel admin</a></p>
<h1>Kelola resep</h1>
<p><a class="btn" href="{{ url_for('admin_resep_baru') }}">+ Tambah resep</a></p>
<div class="tbl-wrap"><table>
  <thead><tr><th>Nama</th><th>Kategori</th><th class="num">Porsi</th><th>Aksi</th></tr></thead>
  <tbody>
  {% for r in rows %}
    <tr>
      <td><a href="{{ url_for('detail_resep', resep_id=r.id) }}">{{ r.nama }}</a></td>
      <td>{{ kat_label(r.kategori) }}</td>
      <td class="num">{{ r.porsi }}</td>
      <td>
        <a href="{{ url_for('admin_resep_edit', rid=r.id) }}">Edit</a>
        <form method="post" action="{{ url_for('admin_resep_hapus', rid=r.id) }}" style="display:inline" onsubmit="return confirm('Hapus resep ini?')">
          <button class="linklike" type="submit">Hapus</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table></div>
{% endblock %}
